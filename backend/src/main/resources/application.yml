spring:
  application:
    name: enterprise-rag-copilot
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ragcopilot;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: ${AI_EMBEDDING_PROVIDER:none}
    vectorstore:
      pgvector:
        initialize-schema: ${PGVECTOR_INIT_SCHEMA:false}
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:disabled}
  autoconfigure:
    exclude: ${AI_AUTOCONFIG_EXCLUDE:org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration}

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET:c3JpbWFuLWVudGVycHJpc2UtcmFnLWNvcGlsb3QtMjU2LWJpdC1zZWNyZXQta2V5}
    expiration-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
