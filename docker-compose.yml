services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragcopilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ragcopilot
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: postgres
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-disabled}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
